name: Build Compass Android Widget
on:
  push:
    branches: [main]
    paths:
      - 'android/CompassWidget/**'
      - '.github/workflows/build-android-widget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble debug APK
        run: gradle -p android/CompassWidget :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Compass-Widget-0.5.2-debug-apk
          path: android/CompassWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
