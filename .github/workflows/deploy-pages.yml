name: Deploy Compass Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
        env:
          VITE_BASE_PATH: /compass-life/
      # Only successful source-and-build validations produce a full source snapshot.
      # The snapshot can be downloaded by ChatGPT's read-only GitHub connection for
      # a complete, reproducible future Full Build. No secrets or node_modules.
      - name: Package validated source snapshot
        run: git archive --format=zip --output=compass-full-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: compass-full-source
          path: compass-full-source.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - id: deployment
        uses: actions/deploy-pages@v4
